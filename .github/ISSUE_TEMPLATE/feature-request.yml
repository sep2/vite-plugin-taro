name: 功能请求
description: 为 VPT 提出新功能或改进建议。
body:
    - type: textarea
      id: problem
      attributes:
          label: 问题与使用场景
          description: 描述你希望解决的问题、使用场景，以及当前行为的局限。
      validations:
          required: true

    - type: textarea
      id: solution
      attributes:
          label: 期望的解决方案
          description: 描述你期望的功能或行为，可以提供 API 设计或使用示例。
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: 考虑过的替代方案
          description: 描述你考虑或尝试过的其他方案，以及它们无法满足需求的原因。
      validations:
          required: false

    - type: textarea
      id: context
      attributes:
          label: 补充信息
          description: 提供相关的目标平台、文档链接、截图或其他有助于理解需求的信息。
      validations:
          required: false
