name: Bug 报告
description: 报告 vpt 的问题。
body:
    - type: markdown
      attributes:
          value: |
              提交前，请先使用 AI 助手分析问题。可复制以下提示词，补充问题描述后直接交给 AI：

              ```text
              请帮我排查当前项目中的 vpt 问题：
              [补充预期行为、实际行为及错误日志]

              请按顺序完成以下所有步骤，不得跳过；即使提前找到原因，也必须完成全部验证并提交报告。不要修改或覆盖原项目。

              1. 阅读 https://vpt.js.org/llms.txt，并按其中的指引查阅相关文档。
              2. 将 vpt 仓库 https://github.com/sep2/vite-plugin-taro 克隆到独立目录，记录检出的 commit，阅读并检查与问题相关的源码。
              3. 检查当前项目的相关代码、配置和依赖版本，记录关键环境信息，结合仓库源码基于证据分析可能的原因。
              4. 使用 vpt 默认模板在另一个独立目录创建全新项目，记录创建命令和依赖版本，运行并验证默认项目是否正常。
              5. 在全新项目中逐步加入触发问题所需的最少代码、配置和依赖，执行可复现的验证步骤，以隔离问题；记录每次改动及实际结果。若无法复现，也必须记录尝试过程与差异。
              6. 在独立项目中验证可能的解决方案，记录执行命令、实际结果及关键日志，明确区分已验证的结论与推测。
              7. 无论问题是否解决，都按以下格式输出简洁报告；未解决时，报告应可直接用于提交 Issue，无需粘贴完整聊天记录。

              生成报告格式：
              ## 问题描述
              - 预期行为：
              - 实际行为：
              - 错误信息：
              ## 环境信息
              - 操作系统、Node.js、包管理器、vpt、版本及目标平台：
              - 仓库 commit：
              ## 步骤完成情况
              - 按步骤 1–7 逐项列出：完成，执行内容、证据及结果。
              ## 默认模板与最小复现
              - 创建命令、依赖版本及默认项目验证结果：
              - 最少改动、复现步骤及实际结果：
              - 最小复现仓库或可直接应用的代码差异：
              ## 源码分析
              - 相关文档、源码文件路径及行号：
              - 已验证的结论及证据：
              - 尚未验证的推测：
              ## 方案与验证
              - 已尝试的方案、命令、结果及关键日志：
              - 最终状态：已解决 / 未解决 / 受阻
              - 剩余问题与下一步：
              ```

    - type: textarea
      id: ai-analysis
      attributes:
          label: AI 报告
          description: 在此粘贴 AI 的报告。
      validations:
          required: true

    - type: input
      id: ai-model
      attributes:
          label: AI 模型名称与版本
          description: 填写用于分析问题的 AI 模型名称与版本。
          placeholder: 例如 gpt-6-astra
      validations:
          required: true

    - type: textarea
      id: description
      attributes:
          label: 人类对问题的补充描述
          description: 如有补充说明，可以写在这里。
      validations:
          required: false
