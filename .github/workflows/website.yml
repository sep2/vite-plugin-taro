name: Deploy documentation to GitHub Pages

on:
  workflow_call:
    inputs:
      release_tag:
        description: Stable release tag already published by the caller
        required: false
        type: string
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  pull_request:
    paths:
      - 'docs/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VPT_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and upload documentation
        uses: withastro/action@v6
        with:
          node-version: 26
          build-cmd: pnpm --filter docs build
          cache-dir: docs/node_modules/.astro
          out-dir: docs/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
