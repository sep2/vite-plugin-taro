name: Deploy documentation to GitHub Pages

on:
  workflow_call:
    inputs:
      deploy:
        description: Deploy the completed build to GitHub Pages
        required: true
        type: boolean
      release_tag:
        description: Stable release tag already published by the caller
        required: false
        type: string

concurrency:
  group: documentation-${{ inputs.deploy && 'pages' || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VPT_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and upload documentation
        uses: withastro/action@v6
        with:
          node-version: 26
          build-cmd: pnpm --filter docs build
          cache-dir: docs/node_modules/.astro
          out-dir: docs/dist

  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
