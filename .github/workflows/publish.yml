name: CI and release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

# Never cancel a running main release or publish the same version concurrently.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  publish:
    if: github.event_name == 'push'
    needs: quality
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      documentation: ${{ steps.changes.outputs.documentation }}
      stable_version: ${{ steps.documentation.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check documentation changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          filters: |
            documentation:
              - '.github/workflows/website.yml'
              - 'docs/**'
              - 'pnpm-*.yaml'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release readiness
        id: ready
        run: |
          pnpm changeset status --output "$RUNNER_TEMP/release-status.json"
          pnpm changeset publish-plan --output "$RUNNER_TEMP/publish-plan.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          import path from 'node:path'
          const status = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, 'release-status.json'), 'utf8'))
          const { plan } = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, 'publish-plan.json'), 'utf8'))
          // Pending changesets or a pending prerelease exit must be versioned locally first.
          const ready = status.changesets.length === 0 && status.releases.length === 0 && plan.length > 0
          appendFileSync(process.env.GITHUB_OUTPUT, `publish=${ready}\n`)
          NODE

      - name: Build and validate release
        if: steps.ready.outputs.publish == 'true'
        run: |
          pnpm prepare:taro
          pnpm build:plugin
          pnpm typecheck

      # Keep this workflow filename: npm Trusted Publishing is configured for publish.yml.
      # Changesets publishes through pnpm, preserving workspace dependencies and publishConfig exports.
      - name: Publish packages, tags and GitHub Releases
        if: steps.ready.outputs.publish == 'true'
        id: release
        uses: changesets/action/publish@v2
        env:
          PNPM_CONFIG_PROVENANCE: true

      - name: Resolve stable documentation version
        if: steps.release.outputs.published == 'true'
        id: documentation
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          // All fixed-group versions are on npm after success, including a partial-publish retry.
          const { version } = JSON.parse(readFileSync('packages/vite-plugin-taro/package.json', 'utf8'))
          if (!version.includes('-')) {
              appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`)
          }
          NODE

  documentation-check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/website.yml
    with:
      deploy: false

  documentation:
    if: needs.publish.outputs.documentation == 'true' || needs.publish.outputs.stable_version != ''
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/website.yml
    with:
      deploy: true
      release_version: ${{ needs.publish.outputs.stable_version }}
