name: Coverage

on:
  push:
    branches:
      - main
    paths: &coverage-paths
      - '.github/workflows/coverage.yml'
      - 'pnpm-lock.yaml'
      - 'packages/vite-plugin-taro/.c8rc.json'
      - 'packages/vite-plugin-taro/src/**'
  pull_request:
    paths: *coverage-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Taro packages
        run: pnpm prepare:taro

      - name: Build plugin
        run: pnpm build:plugin

      - name: Enforce 100% coverage
        run: pnpm test:coverage
