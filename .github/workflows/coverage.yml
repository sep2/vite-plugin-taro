name: Coverage

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/coverage.yml'
      - 'packages/vite-plugin-taro/**'
  pull_request:
    paths:
      - '.github/workflows/coverage.yml'
      - 'packages/vite-plugin-taro/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Taro packages
        run: pnpm prepare:taro

      - name: Build plugin
        run: pnpm build:plugin

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage summary
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: packages/vite-plugin-taro/coverage/coverage-summary.json

  coverage-badge:
    name: Update coverage badge
    needs: test
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download coverage summary
        uses: actions/download-artifact@v8
        with:
          name: coverage-summary
          path: coverage

      - name: Update coverage badge
        uses: we-cli/coverage-badge-action@8a0b6ee05f6dd0f294089cbe7a848452a2b43eef
