packages:
  - packages/*
  - demo/*
  - docs

overrides:
  react: '^19.3.0'
  react-dom: '^19.3.0'
  # Vite, VPT, and generated apps must share one Rolldown DevRuntime ABI.
  rolldown: 1.2.13
  vite: 8.3.4
  # Taro's copied H5 components and the published runtime share the prototype-pollution-fixed Swiper.
  swiper: 12.1.2
  # Taro 4.3.0 references Rollup only from declarations; VPT's runtime and build pipeline use Rolldown.
  '@tarojs/runner-utils@4.3.0>rollup': '-'
  # The runtime build copies H5 APIs and metadata, never the upstream Babel-based compiler entry.
  '@tarojs/plugin-platform-h5@4.3.0>babel-plugin-transform-taroapi': '-'

peerDependencyRules:
  allowedVersions:
    '@tarojs/taro@4.3.0>@types/react': '^19.0.0'

allowBuilds:
  '@biomejs/biome': false
  '@parcel/watcher': false
  '@swc/core': false
  # core-js postinstall only prints a donation banner; no build is needed.
  core-js: false
  esbuild: true

patchedDependencies:
  '@tarojs/plugin-html@4.3.0': patches/generated/@tarojs__plugin-html@4.3.0.patch
  '@tarojs/plugin-framework-react@4.3.0': patches/generated/@tarojs__plugin-framework-react@4.3.0.patch
  '@tarojs/react@4.3.0': patches/generated/@tarojs__react@4.3.0.patch
  '@tarojs/runtime@4.3.0': patches/generated/@tarojs__runtime@4.3.0.patch
  canvas-confetti@1.9.4: patches/generated/canvas-confetti@1.9.4.patch

minimumReleaseAgeExclude:
  - '@rolldown/binding-android-arm-eabi@1.2.13'
  - '@rolldown/binding-android-arm64@1.2.13'
  - '@rolldown/binding-darwin-arm64@1.2.13'
  - '@rolldown/binding-darwin-x64@1.2.13'
  - '@rolldown/binding-freebsd-x64@1.2.13'
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.13'
  - '@rolldown/binding-linux-arm64-gnu@1.2.13'
  - '@rolldown/binding-linux-arm64-musl@1.2.13'
  - '@rolldown/binding-linux-ppc64-gnu@1.2.13'
  - '@rolldown/binding-linux-s390x-gnu@1.2.13'
  - '@rolldown/binding-linux-x64-gnu@1.2.13'
  - '@rolldown/binding-linux-x64-musl@1.2.13'
  - '@rolldown/binding-openharmony-arm64@1.2.13'
  - '@rolldown/binding-win32-arm64-msvc@1.2.13'
  - '@rolldown/binding-win32-x64-msvc@1.2.13'
  - rolldown@1.2.13
  - vite@8.3.4
