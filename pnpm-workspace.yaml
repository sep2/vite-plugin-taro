packages:
  - packages/*
  - docs

overrides:
  react: '^19.2.7'
  react-dom: '^19.2.7'
  vite: 8.2.1
  '@tarojs/runner-utils>rollup': 4.60.3

allowBuilds:
  '@biomejs/biome': false
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true

minimumReleaseAgeExclude:
  - '@weapp-tailwindcss/postcss@3.1.10 || 3.2.8'
  - weapp-tailwindcss@5.1.14 || 5.2.11
  - '@astrojs/starlight@0.41.7'
  - vite@8.2.1
