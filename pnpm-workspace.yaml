packages:
  - packages/*
  - docs

overrides:
  react: '^19.3.0'
  react-dom: '^19.3.0'
  vite: 8.3.0
  # Taro 4.2.1 references Rollup only from declarations; VPT's runtime and build pipeline use Rolldown.
  '@tarojs/runner-utils@4.2.1>rollup': '-'
  # The runtime build copies H5 APIs and metadata, never the upstream Babel-based compiler entry.
  '@tarojs/plugin-platform-h5@4.2.1>babel-plugin-transform-taroapi': '-'

peerDependencyRules:
  allowedVersions:
    '@tarojs/taro@4.2.1>@types/react': '^19.0.0'

allowBuilds:
  '@biomejs/biome': false
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true

patchedDependencies:
  '@tarojs/plugin-framework-react@4.2.1': patches/@tarojs__plugin-framework-react@4.2.1-react19.patch
  '@tarojs/react@4.2.1': patches/@tarojs__react@4.2.1-react19.patch
  '@tarojs/runtime@4.2.1': patches/@tarojs__runtime@4.2.1.patch
  canvas-confetti@1.9.4: patches/canvas-confetti@1.9.4.patch
