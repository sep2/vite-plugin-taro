packages:
  - packages/*
  - demo/*
  - docs

shellEmulator: true

overrides:
  react: '^19.3.1'
  react-dom: '^19.3.1'
  # Vite, VPT, and generated apps must share one Rolldown DevRuntime ABI.
  rolldown: 1.2.19
  vite: 8.3.8
  # Taro's copied H5 components and the published runtime share the prototype-pollution-fixed Swiper.
  swiper: 12.2.0
  # Taro references Rollup only from declarations; VPT's runtime and build pipeline use Rolldown.
  '@tarojs/runner-utils@4.3.3>rollup': '-'
  # The runtime build copies H5 APIs and metadata, never the upstream Babel-based compiler entry.
  '@tarojs/plugin-platform-h5@4.3.3>babel-plugin-transform-taroapi': '-'

peerDependencyRules:
  allowedVersions:
    '@tarojs/taro@4.3.3>@types/react': '^19.0.0'

allowBuilds:
  '@biomejs/biome': false
  '@parcel/watcher': false
  '@swc/core': false
  # core-js postinstall only prints a donation banner; no build is needed.
  core-js: false
  esbuild: true

patchedDependencies:
  '@tarojs/plugin-html@4.3.3': patches/generated/@tarojs__plugin-html@4.3.3.patch
  '@tarojs/plugin-framework-react@4.3.3': patches/generated/@tarojs__plugin-framework-react@4.3.3.patch
  '@tarojs/react@4.3.3': patches/generated/@tarojs__react@4.3.3.patch
  '@tarojs/runtime@4.3.3': patches/generated/@tarojs__runtime@4.3.3.patch
  canvas-confetti@1.9.4: patches/generated/canvas-confetti@1.9.4.patch
