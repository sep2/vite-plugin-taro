packages:
  - packages/*
  - docs

overrides:
  react: '^19.2.8'
  react-dom: '^19.2.8'
  vite: 8.2.2
  # Taro 4.2.1 references Rollup only from declarations; VPT's runtime and build pipeline use Rolldown.
  '@tarojs/runner-utils@4.2.1>rollup': '-'

peerDependencyRules:
  allowedVersions:
    '@tarojs/taro@4.2.1>@types/react': '^19.0.0'

allowBuilds:
  '@biomejs/biome': false
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true

minimumReleaseAgeExclude:
  - '@weapp-tailwindcss/postcss@3.2.11'
  - '@astrojs/starlight@0.41.9'
  - astro@7.2.7
  - vite@8.2.2

patchedDependencies:
  canvas-confetti@1.9.4: patches/canvas-confetti@1.9.4.patch
